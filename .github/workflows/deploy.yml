name: CI/CD — Match Quest

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 PHPUnit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, bcmath, gd
          coverage: xdebug

      - name: Install Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test --coverage --min=60
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  build:
    name: 🔨 Build Assets
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build

  deploy:
    name: 🚀 Deploy to Beget
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring

      - name: Install Composer (no-dev)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: public/build

      - name: Prepare Deploy Package
        run: |
          rm -rf .git tests node_modules .github
          cp .env.beget .env
          php artisan config:cache
          php artisan route:cache

      - name: Deploy via SSH/RSYNC
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.BEGET_HOST }}
          REMOTE_USER: ${{ secrets.BEGET_USER }}
          REMOTE_PORT: ${{ secrets.BEGET_PORT || '22' }}
          SOURCE: './'
          TARGET: ${{ secrets.BEGET_PATH }}
          ARGS: '-avz --delete --exclude=.env --exclude=storage/logs/* --exclude=storage/framework/cache/* --exclude=storage/framework/sessions/*'

      - name: Post-Deploy Commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: ${{ secrets.BEGET_USER }}
          key: ${{ secrets.BEGET_SSH_KEY }}
          port: ${{ secrets.BEGET_PORT || '22' }}
          script: |
            cd ${{ secrets.BEGET_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan cache:clear
            echo "✅ Deploy completed at $(date)"
