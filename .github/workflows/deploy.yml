name: Deploy Match3 Quest to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match3-beget-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_DIR: /home/a/adolmax0/apps/match3-quest
      WEB_DIR: /home/a/adolmax0/lab.iig.ru/public_html/3Row
      BEGET_HOST: ${{ secrets.BEGET_HOST }}
      BEGET_USER: ${{ secrets.BEGET_USER }}
      BEGET_PORT: ${{ secrets.BEGET_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gd
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      - name: Check PHP platform and Laravel boot
        run: |
          set -euo pipefail
          composer check-platform-reqs --no-dev
          composer audit --locked --no-dev
          php artisan --version
          php artisan route:list --path=api/v1
          php artisan route:list --path=up
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend
        env:
          ASSET_URL: https://lab.iig.ru/3Row
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f public/build/manifest.json
          test -f public/assets/js/api-client.js

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$BEGET_HOST"
          test -n "$BEGET_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/beget_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/beget_deploy" "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/beget_deploy" > /dev/null

          cat > "$HOME/.ssh/config" <<CONFIG
          Host beget-deploy
            HostName $BEGET_HOST
            User $BEGET_USER
            Port $BEGET_PORT
            IdentityFile ~/.ssh/beget_deploy
            IdentitiesOnly yes
            IdentityAgent none
            BatchMode yes
            StrictHostKeyChecking yes
          CONFIG

          chmod 600 "$HOME/.ssh/config"

      - name: Check server
        run: |
          set -euo pipefail
          ssh beget-deploy 'bash -se' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/home/a/adolmax0/apps/match3-quest
          WEB_DIR=/home/a/adolmax0/lab.iig.ru/public_html/3Row

          test "$(whoami)" = adolmax0
          test -d "$APP_DIR"
          test -w "$APP_DIR"
          test -s "$APP_DIR/.env"
          test -w "$(dirname "$WEB_DIR")"

          if [ -L "$WEB_DIR" ]; then
            test "$(readlink -f "$WEB_DIR")" = "$APP_DIR/public"
          elif [ -e "$WEB_DIR" ]; then
            test -d "$WEB_DIR"
          fi

          command -v rsync
          php8.2 -v
          REMOTE

      - name: Upload application
        run: |
          set -euo pipefail
          rsync -rz --itemize-changes \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/.env*' \
            --exclude='/.phpunit.result.cache' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/public/hot' \
            --exclude='/public/storage' \
            --exclude='/public/assets/js/game_engine.test.js' \
            ./ "beget-deploy:$APP_DIR/"

      - name: Prepare Laravel and publish in 3Row
        run: |
          set -euo pipefail
          ssh beget-deploy 'bash -se' <<'REMOTE'
          set -euo pipefail

          APP_DIR=/home/a/adolmax0/apps/match3-quest
          WEB_DIR=/home/a/adolmax0/lab.iig.ru/public_html/3Row

          cd "$APP_DIR"

          mkdir -p \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache

          rm -f public/hot

          php8.2 vendor/composer/platform_check.php
          php8.2 artisan config:clear
          php8.2 artisan route:clear

          if ! grep -Eq '^APP_KEY=base64:.+$' .env; then
            if grep -Eq '^APP_KEY=(""|'\'''\''|[[:space:]]*)$' .env; then
              php8.2 artisan key:generate --force
            else
              echo "APP_KEY is missing or has an unexpected format; inspect it manually."
              exit 1
            fi
          fi

          php8.2 artisan migrate --force
          php8.2 artisan db:seed --force
          php8.2 artisan config:cache
          php8.2 artisan view:cache
          php8.2 artisan route:list --path=api/v1

          if [ ! -e public/storage ] && [ ! -L public/storage ]; then
            php8.2 artisan storage:link
          fi

          test -f public/index.php
          test -f public/build/manifest.json

          if [ -L "$WEB_DIR" ]; then
            test "$(readlink -f "$WEB_DIR")" = "$APP_DIR/public"
          else
            if [ -e "$WEB_DIR" ]; then
              BACKUP="/home/a/adolmax0/3Row-before-deploy-$(date +%Y%m%d-%H%M%S)"
              mv "$WEB_DIR" "$BACKUP"
              echo "Previous 3Row saved to: $BACKUP"
            fi

            ln -s "$APP_DIR/public" "$WEB_DIR"
          fi

          echo "Deployment completed"
          REMOTE

      - name: HTTP health check
        run: |
          set -euo pipefail
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 2 \
            https://lab.iig.ru/3Row/up

      - name: Remove private key
        if: always()
        run: rm -f "$HOME/.ssh/beget_deploy"
